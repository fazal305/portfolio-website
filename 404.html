<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Fazal Abbas</title>
    <style>
      :root {
        --bg: #070b12;
        --panel: #0d1422;
        --text: #eef4ff;
        --muted: #97a7bd;
        --accent: #38d5ff;
        --line: rgba(160, 180, 210, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 30% 0%,
            rgba(56, 213, 255, 0.18),
            transparent 30rem
          ),
          var(--bg);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }

      main {
        width: min(520px, 100%);
        padding: 34px;
        background: rgba(13, 20, 34, 0.88);
        border: 1px solid var(--line);
        border-radius: 10px;
        text-align: center;
      }

      span {
        color: var(--accent);
        font-family: Consolas, monospace;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0;
        font-size: clamp(2.5rem, 10vw, 5rem);
        line-height: 1;
      }

      p {
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 14px;
        padding: 0 18px;
        border-radius: 8px;
        background: var(--accent);
        color: #06111d;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span>404</span>
      <h1>Page not found</h1>
      <p>
        The page you opened does not exist, but the portfolio is still right
        here.
      </p>
      <a href="/">Back to Portfolio</a>
    </main>
  </body>
</html>
